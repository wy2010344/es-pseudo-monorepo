packages:
  - 'apps/*'
  - 'apps/chat-note/client'
  - 'packages/*/*'
  - 'config/*'
  - 'x-manage/*'

exclude:
  - 'packages/wy-react-helper/website'
  - 'packages/mve/website'
  - 'packages/better-react/website'

allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  canvas: false
  core-js: false
  core-js-pure: false
  esbuild: true
  protobufjs: false
  sharp: false
  spawn-sync: false

blockExoticSubdeps: false

catalog:
  # Build tools
  typescript: ^6.0.2
  eslint: ^10.1.0
  prettier: ^3.6.2
  tsdown: latest

  # Commit/CI
  '@commitlint/cli': ^21.0.1
  '@commitlint/config-conventional': ^21.0.1
  commitizen: ^4.3.1
  cz-conventional-changelog: ^3.3.0
  husky: ^9.1.7
  lint-staged: ^17.0.5

  # CSS/Styling
  tailwindcss: ^4.1.16
  '@tailwindcss/vite': ^4.1.14
  '@tailwindcss/postcss': ^4.1.16
  '@tailwindcss/typography': ^0.5.16
  daisyui: ^5.0.42
  stylis: ^4.3.2
  sass-embedded: ^1.92.1
  postcss: ^8.5.15

  # React
  react: ^19.2.3
  react-dom: ^19.2.3
  '@types/react': ^19.2.14
  '@types/react-dom': ^19.2.3

  # Utilities
  '@faker-js/faker': ^10.4.0
  motion: ^12.23.0
  history: ^5.3.0
  dexie: ^4.2.0
  tyme4ts: ^1.3.4
  linebreak: ^1.1.0
  d3-binarytree: ^1.0.2
  d3-octree: ^1.1.0
  d3-quadtree: ^3.0.1
  '@types/d3-quadtree': ^3.0.6
  d3: ^7.9.0
  csstype: ^3.1.3
  lodash: ^4.18.1
  immutable: ^5.1.5
  lottie-web: ^5.12.2
  clsx: ^2.1.1
  marked: ^18.0.4
  konva: ^10.0.12

  # Type packages
  '@types/node': ^25.5.0
  '@types/d3': ^7.4.3
  '@types/culori': ^4.0.1
  '@types/lodash': ^4.17.21

  # Vite
  vite: ^8.0.14
  '@vitejs/plugin-react': ^6.0.2

  # ESLint ecosystem
  globals: ^17.4.0
  '@eslint/js': ^10.0.1
  typescript-eslint: ^8.46.4
  eslint-plugin-react-hooks: ^7.0.1
  eslint-plugin-react-refresh: ^0.5.2
  '@chenglou/pretext': ^0.0.7
  # Other common
  lucide-react: ^1.16.0
  dayjs: ^1.11.13
  '@mdx-js/react': ^3.0.0
  '@floating-ui/dom': ^1.7.2
  three: ^0.184.0
  zod: ^4.1.13
  superjson: ^2.2.2
  tailwind-merge: ^3.4.0
  'mve-icons': ^6.0.0

minimumReleaseAgeExclude:
  - fumadocs-mdx@15.0.9
  - '@turbo/darwin-64@2.9.15'
  - '@turbo/darwin-arm64@2.9.15'
  - '@turbo/linux-64@2.9.15'
  - '@turbo/linux-arm64@2.9.15'
  - '@turbo/windows-64@2.9.15'
  - '@turbo/windows-arm64@2.9.15'
  - turbo@2.9.15
